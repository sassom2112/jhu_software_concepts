# Read the Docs build for the Module 4 documentation (module_4/docs).
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"

sphinx:
  configuration: module_4/docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: module_4/requirements.txt       # autodoc imports the application modules
    - requirements: module_4/docs/requirements.txt  # Sphinx and the theme
