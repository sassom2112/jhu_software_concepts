# The Module 6 stack (Flask web + worker + PostgreSQL + RabbitMQ) on one EC2 instance.
#
# The server needs only these three files, in one folder (EC2_DEPLOYMENT.md shows how
# they get there):
#
#   docker-compose.ec2.yml       this file
#   .env                         the passwords (copied from .env.example, never committed)
#   data/applicant_data.json     the 30,500 applicants from module_6/src/data (36 MB)
#
# Nothing is built on the server: web, worker and init use the published images from
# Docker Hub (frametotoro/module_6, linux/amd64), and db/rabbitmq use the official ones.
#
#   docker compose -f docker-compose.ec2.yml --env-file .env up -d
#   docker compose -f docker-compose.ec2.yml ps
#   docker compose -f docker-compose.ec2.yml logs -f worker
#   docker compose -f docker-compose.ec2.yml down          # stop; the data stays in the volumes
#
# Differences from module_6/docker-compose.yml:
#   * image only, no build: sections;
#   * postgres:16 and rabbitmq:3.13-management (the versions the assignment names);
#   * the page is published on all interfaces (port 8080), so http://<EC2_PUBLIC_IPV4>:8080
#     works; the EC2 security group decides who may connect (your IP only);
#   * the RabbitMQ management UI stays on 127.0.0.1:15672 of the server, reachable only
#     through an SSH tunnel;
#   * only init mounts the data file (it is the only service that reads it);
#   * every container's log is capped at 3 x 10 MB, so the small root disk cannot fill up.
#
# PostgreSQL (5432) and AMQP (5672) are not published at all: the services reach each
# other by name (db, rabbitmq) on the project's private Compose network.
# Every secret comes from .env: ${NAME:?...} stops Compose with that message if one is
# missing, instead of starting a service with an empty password.

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-hardened: &hardened
  read_only: true                  # the code cannot be changed in a running container
  tmpfs:
    - /tmp                         # the one writable place (the scraper's files go here)
  cap_drop: [ALL]                  # no Linux capabilities: nothing here needs root powers
  security_opt:
    - "no-new-privileges:true"
  init: true                       # a tiny init process forwards docker stop's SIGTERM

x-rabbitmq-url: &rabbitmq-url "amqp://${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env (see .env.example)}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env (see .env.example)}@rabbitmq:5672/"

services:
  db:
    <<: *logging
    image: postgres:16
    environment:
      POSTGRES_USER: gradcafe      # the administrator: owns the tables, used only by init
      POSTGRES_DB: gradcafe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data   # survives down, reboots and instance stop/start
    healthcheck:
      # Over TCP: during its first start PostgreSQL runs a temporary server on the Unix
      # socket only, which must not count as ready.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U gradcafe -d gradcafe"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq:
    <<: *logging
    image: rabbitmq:3.13-management
    hostname: rabbitmq             # RabbitMQ keeps its data under its node name, rabbit@rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER in .env (see .env.example)}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS in .env (see .env.example)}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq   # durable queues and persistent messages
    ports:
      # Management UI on the server's loopback only: open it through an SSH tunnel
      # (ssh -L 15672:127.0.0.1:15672 ...).  Never open 15672 in the security group.
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  init:
    <<: [*hardened, *logging]
    image: frametotoro/module_6:worker-v1
    # One-shot: creates the tables and the two service roles, loads applicant_data.json and
    # computes the first analysis snapshot, then exits 0.  Running it again is harmless.
    command: ["python", "-m", "worker.bootstrap"]
    environment:
      # The table owner: creating tables and roles needs it.  Nothing else logs in as it.
      DATABASE_URL: postgresql://gradcafe:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/gradcafe
      WEB_DB_USER: ${WEB_DB_USER:-gradcafe_web}
      WEB_DB_PASSWORD: ${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env (see .env.example)}
      WORKER_DB_USER: ${WORKER_DB_USER:-gradcafe_worker}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env (see .env.example)}
    volumes:
      # The data file, read-only.  create_host_path: false makes a forgotten scp stop
      # `up` with "bind source path does not exist"; without it Docker would create an
      # empty directory named applicant_data.json and init would fail on that instead.
      - type: bind
        source: ./data/applicant_data.json
        target: /app/data/applicant_data.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: [*hardened, *logging]
    image: frametotoro/module_6:web-v1
    environment:
      # The read-only web role: SELECT on applicants and analysis_snapshot, nothing else.
      DATABASE_URL: postgresql://${WEB_DB_USER:-gradcafe_web}:${WEB_DB_PASSWORD:?set WEB_DB_PASSWORD in .env (see .env.example)}@db:5432/gradcafe
      RABBITMQ_URL: *rabbitmq-url
    ports:
      # All interfaces, so the page answers on the instance's public IPv4.  The security
      # group allows port 8080 from your IP only.
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      # GET /healthz answers "ok" without touching the database.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: [*hardened, *logging]
    image: frametotoro/module_6:worker-v1
    environment:
      # The worker role: SELECT and INSERT on applicants, UPSERTs on its two bookkeeping tables.
      DATABASE_URL: postgresql://${WORKER_DB_USER:-gradcafe_worker}:${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env (see .env.example)}@db:5432/gradcafe
      RABBITMQ_URL: *rabbitmq-url
      SCRAPE_DATA_DIR: /tmp/gradcafe_scrape
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped        # a lost broker connection ends the process; Docker restarts it

volumes:
  pgdata:          # PostgreSQL's data directory
  rabbitmq_data:   # RabbitMQ's queues and persistent messages
