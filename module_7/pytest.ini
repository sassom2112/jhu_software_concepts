[pytest]
# Offline tests of s3_fetch.py, the notebook and the EC2 compose file (no AWS account,
# no network).  Run them in module_7/ with `python -m pytest`, or from the repository
# root with `python -m pytest module_7`.  pythonpath puts module_7/ on sys.path, so the
# tests import s3_fetch the same way the notebook does.
testpaths = tests
pythonpath = .
addopts = -ra
