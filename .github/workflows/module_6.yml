# Module 6 CI: three separate jobs on every push or pull request that changes module_6/.
#
#   pylint  - Pylint on module_6/src must score 10.00/10 (--fail-under=10, default settings)
#   pytest  - the whole suite against a throwaway PostgreSQL; fails below 100% coverage.
#             RabbitMQ and Grad Cafe are faked by the tests, so neither is needed here.
#   docker  - docker-compose.yml is valid and both service images build; each image runs
#             as uid 1000, not root.  Nothing is pushed.
#
# The other workflows stay with their own folders: ci.yml runs only for module_5/ and
# tests.yml only for module_4/, so a Module 6 change starts this workflow alone.
name: module_6

on:
  push:
    paths: ["module_6/**", ".github/workflows/module_6.yml"]
  pull_request:
    paths: ["module_6/**", ".github/workflows/module_6.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:                        # a newer push to the same branch cancels the older run
  group: module-6-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash                     # bash -eo pipefail: any failing command fails the step
    working-directory: module_6

jobs:
  pylint:
    name: Pylint (10.00/10 required)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module_6/requirements.txt

      - name: Install the pinned environment and the project
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Pylint, failing below 10
        run: pylint src --fail-under=10

  pytest:
    name: Pytest (100% coverage required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gradcafe
          POSTGRES_DB: gradcafe_test                       # the tests only run against a *_test database
          POSTGRES_PASSWORD: ci-throwaway-not-a-secret     # this throwaway container only
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256         # real password checks, so the role tests mean something
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gradcafe -d gradcafe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://gradcafe@localhost:5432/gradcafe_test
      PGPASSWORD: ci-throwaway-not-a-secret     # libpq reads it; the URL stays free of passwords

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: module_6/requirements.txt

      - name: Install the pinned environment and the project
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Run the test suite from the repository root (pytest.ini measures module_6/src)
        working-directory: .
        run: pytest module_6 -m "web or buttons or analysis or db or integration"

  docker:
    name: Docker images build (web and worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: A placeholder .env, so Compose can resolve every required variable
        run: cp .env.example .env

      - name: docker-compose.yml is valid
        run: docker compose config --quiet

      - name: Build both images (the worker image also serves the init service)
        run: docker compose build

      - name: Both images run as uid 1000, not root
        run: |
          for image in frametotoro/module_6:web-v1 frametotoro/module_6:worker-v1; do
            user=$(docker image inspect --format '{{.Config.User}}' "$image")
            echo "$image runs as $user"
            test "$user" = "1000:1000"
          done
