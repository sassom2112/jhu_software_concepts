{% extends "base.html" %}
{% block title %}Projects - {{ profile.name }}{% endblock %}

{% block content %}
<section class="projects">
  <h1>Projects</h1>
  {% for project in projects %}
  <article class="project-card">
    <h2>{{ project.title }}</h2>
    <p>{{ project.description }}</p>
    <p><a href="{{ project.github_url }}" target="_blank" rel="noopener">
      View on GitHub &rarr;</a></p>
  </article>
  {% endfor %}
</section>
{% endblock %}
