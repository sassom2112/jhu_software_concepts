[pytest]
addopts = -q --cov=module_6/src --cov-report=term-missing --cov-fail-under=100
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
# The command-line tests re-run already-imported modules such as db.load_data as __main__
# with runpy; Python warns about that for modules inside packages, and here it is intended.
filterwarnings =
    ignore:.*found in sys.modules after import of package:RuntimeWarning
